[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pedler-jelly-substrate"
version = "0.1.0"
description = "Kuramoto oscillator substrate + the PEDLER cognitive-automaton engine, with a Qiskit validation bridge, Max-Cut benchmarks, and a mocked hardware bridge."
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Abhishek Choudhary" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
quantum = ["qiskit>=1.0"]
gpu = ["torch>=2.0"]
hardware = ["pyserial>=3.5"]

[tool.setuptools.packages.find]
include = ["pedler*"]
